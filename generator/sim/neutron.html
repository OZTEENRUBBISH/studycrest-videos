  if (sc === 'room' && t >= T.desk && t < T.burst) { const p = proj(SPOON, cam); lab += L(p[0] - 360, p[1] - 250, seg(t, T.desk + 1.2, T.desk + 1.7), 'Nothing holds it in', 'width:330px;text-align:right'); }

    else { lab += L(pn[0] - 150, pn[1] + 150, a2, '<b style="color:#ff8a7a">Proton</b>', 'width:300px;text-align:center'); const pe = pix(eBall), pv = pix(nuBall); lab += L(clamp(pe[0] - 150, 500, 760), pe[1] + 30, a2, '<span style="color:#9cd0ff">Electron</span>'); lab += L(clamp(pv[0] - 110, 60, 400), pv[1] + 30, a2, 'Antineutrino'); } }
