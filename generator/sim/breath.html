  else if (t < T.dip2) O.hudSet('Breathing fast', 'CO₂ ↓', 'Carbon dioxide flushed out\nThe urge to breathe is delayed');
  else if (t < T.out + 0.9) O.hudSet('The urge', 'Late', 'Low carbon dioxide\nNo urge to breathe yet');
  else if (t < T.rule) O.hudSet('Oxygen', 'Too low', 'Blackout\nwith no warning');
  else if (t < T.fin) O.hudSet('In water', 'Never alone', 'Someone watching\ncan pull you out');
  else if (t < T.end) O.hudSet('Telling you to breathe', 'CO₂', 'Mostly carbon dioxide\nYou are not out of oxygen');
  else ha = 0;
  O.show(O.hud, ha); O.hud.style.top = '1000px';
  let lab = ''; const L = (x, y, a, html, al) => `<div class="lab" style="left:${Math.round(x)}px;top:${Math.round(y)}px;opacity:${clamp(a).toFixed(3)};${al || ''}">${html}</div>`;
  const wp = (o, dy = 0) => { const v = new THREE.Vector3(); o.getWorldPosition(v); v.y += dy; return proj(v, cam); };
  // the gauges
  const G = gauges(t);
  if (G && t < T.end) { const a = t < T.pool ? seg(t, T.in + 0.1, T.in + 0.4) : (t < T.up + 3 && t >= T.under ? (t >= T.stem ? seg(t, T.stem, T.stem + 0.4) : Math.min(seg(t, T.under, T.under + 0.4), 1 - seg(t, T.blood - 0.3, T.blood))) : (t >= T.fin ? seg(t, T.fin + 0.2, T.fin + 0.6) * (1 - seg(t, T.end - 0.3, T.end)) : seg(t, T.risk + 0.2, T.risk + 0.6))) * (t >= T.rule - 0.3 && t < T.rule ? 1 - seg(t, T.rule - 0.3, T.rule) : 1);
    const bar = (name, v, col, mark, mlab, hot) => `<div style="margin-bottom:26px"><div style="font-size:22px;letter-spacing:3px;margin-bottom:9px">${name}</div><div style="position:relative;width:430px;height:30px;border-radius:15px;background:rgba(8,12,30,.6);border:2px solid rgba(255,255,255,.6);box-shadow:0 2px 14px rgba(0,0,0,.5)"><div style="position:absolute;left:3px;top:3px;height:24px;border-radius:12px;width:${Math.round(clamp(v) * 424)}px;background:${hot ? '#ff5a4a' : col}"></div>${mark != null ? `<div style="position:absolute;left:${Math.round(mark * 424)}px;top:-9px;width:4px;height:48px;background:#fff;border-radius:2px"></div><div style="position:absolute;left:${Math.round(mark * 424) - 120}px;width:244px;text-align:center;top:44px;font-size:17px;letter-spacing:2.5px;color:${hot ? '#ffb0a6' : '#fff'}">${mlab}</div>` : ''}</div></div>`;
    let h = bar('Oxygen in your blood', G.o, '#7fc4ff', G.risk ? BLACK : null, 'Blackout', G.risk && G.o <= BLACK + 0.02);
    if (G.c != null) h += `<div style="height:${G.risk ? 30 : 0}px"></div>` + bar('Carbon dioxide', G.c, '#ffd64a', ALARM, 'Urge to breathe', G.c >= ALARM && Math.sin(t * 16) > -0.3);
    h += `<div style="font-size:16px;letter-spacing:2.5px;color:#d5e2ff;margin-top:${G.c != null ? 38 : 4}px">${G.myth ? 'The myth' : 'Illustration · not to scale'}</div>`;
    lab += L(90, 480, a, h); }
  if (t >= T.under + 0.6 && t < T.blood) lab += L(90, 800, fade(T.under + 0.6, T.blood), '<span style="color:#ff8a8a">● Heart</span><b>slowing down</b>');
  if (t >= T.blood + 0.4 && t < T.stem) { const a = fade(T.blood + 0.4, T.stem); lab += L(90, 480, a, '<span style="color:#ffd64a">● Carbon dioxide</span><b>building up</b>'); lab += L(90, 640, a, '<span style="color:#8fd0ff">● Oxygen</span><b>slowly used up</b>'); lab += L(90, 800, a * 0.95, 'Inside a blood vessel<br>Illustration · not to scale', 'font-size:18px;letter-spacing:2.5px;color:#ffe0e0'); }
  if (t >= T.stem + 0.6 && t < T.dia) lab += L(90, 800, fade(T.stem + 0.6, T.dia), '<span style="color:#ffe14a">● Brainstem sensors</span><b>feel it rising</b>');
  if (t >= T.dia + 0.3 && t < T.oxy) lab += L(90, 800, fade(T.dia + 0.3, T.oxy), '<span style="color:#ffd64a">● Urge to breathe</span><b>growing</b>');
  if (t >= T.oxy + 0.3 && t < T.up) lab += L(90, 800, fade(T.oxy + 0.3, T.up), '<span style="color:#8fd0ff">● Oxygen in your lungs</span><b>enough for<br>about 4 minutes</b>');
  if (t >= T.out + 1.0 && t < T.rule) lab += L(90, 1196, fade(T.out + 1.0, T.rule) * 0.9, 'Called shallow water blackout', 'font-size:20px;letter-spacing:2px;color:#d5e2ff');
  if (frame.alarm > 0.01 && t < T.up) { const p = wp(org.stem); for (let i = 0; i < 3; i++) { const u = (t * 1.1 + i / 3) % 1, r = 20 + u * 150; lab += `<div style="position:absolute;left:${(p[0] - r).toFixed(1)}px;top:${(p[1] - r).toFixed(1)}px;width:${(2 * r).toFixed(1)}px;height:${(2 * r).toFixed(1)}px;border-radius:50%;border:5px solid rgba(255,225,74,${(0.85 * (1 - u) * frame.alarm).toFixed(3)});box-sizing:border-box"></div>`; } }
  if (O.labels._h !== lab) { O.labels._h = lab; O.labels.innerHTML = lab; }
  let fl = 0; for (const [a, dd, k] of [[T.in, 0.35, 0.8], [T.truth, 0.4, 0.9], [T.pool, 0.35, 0.8], [12.2, 0.3, 0.55], [T.blood, 0.35, 0.75], [T.stem, 0.35, 0.7], [T.dia, 0.25, 0.4], [T.oxy, 0.25, 0.4], [T.up, 0.35, 0.8], [T.risk, 0.35, 0.8], [T.dip2 + 0.15, 0.3, 0.5], [T.rule, 0.4, 0.9], [T.fin, 0.35, 0.7]]) if (t >= a - 0.06 && t < a + dd) fl = Math.max(fl, t < a ? seg(t, a - 0.06, a) * k : (1 - seg(t, a, a + dd)) * k);
  O.flash.style.background = `rgba(${t >= T.blood - 0.1 && t < T.stem - 0.1 ? '255,200,200' : '235,250,255'},${fl})`;
  O.tint.style.background = 'linear-gradient(180deg, rgba(4,10,26,0) 40%, rgba(4,10,26,.42) 60%, rgba(4,10,26,.62) 100%), linear-gradient(90deg, rgba(4,10,26,.45) 0, rgba(4,10,26,0) 60%)';
  O.show(O.end, seg(t, T.end, T.end + 0.4)); O.show(O.badge, 1 - seg(t, T.end, T.end + 0.3));
}
window.DUR = DUR;
window.renderAt = (t) => { frame(t); overlayFrame(t); return true; };
await document.fonts.ready; window.renderAt(0); window.READY = true;
</script></body></html>
