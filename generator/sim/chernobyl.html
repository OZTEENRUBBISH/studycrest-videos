  if (t < T.room || (t >= T.boom && t < T.atom)) extFrame(t); else if (t < T.core || (t >= T.az && t < T.rods)) roomFrame(t); else if (t < T.boom) cs = coreFrame(t); else { if (t < T.half) atomFrame(t); else { nuc.visible = alpha.visible = beta.visible = gamma.visible = false; trails.forEach(l => l.visible = false); postAtom.render(); nuc.visible = true; } }
